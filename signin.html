<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appora — Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.0.2/dist/phosphor.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-background">
  <div class="preloader" id="preloader">
    <div class="crack crack1"></div>
    <div class="crack crack2"></div>
    <div class="crack crack3"></div>
    <div class="crack crack4"></div>
    <div class="crack crack5"></div>
  </div>
  <main class="section" style="padding: 4rem 0; min-height: calc(100vh - 120px);">
    <div class="container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
            <span class="logo-mark">A</span>
            <span class="font-extrabold text-xl">Appora</span>
          </div>
          <h1>Welcome Back</h1>
          <p class="text-sm text-muted-foreground">Sign in to access your saved apps and bookmarks.</p>
        </div>

        <form class="auth-form" id="signinForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <div style="margin-top: 1rem;">
            <button type="submit" class="btn-primary">Sign In</button>
          </div>
          <div style="margin-top: 1.5rem; font-size: 0.875rem;">
            <a href="signup.html" class="text-primary font-medium">Create Account</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script>
    const form = document.getElementById('signinForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (email) {
          window.location.href = 'dashboard.html';
        }
      });
    }

    // Preloader: shows on slow server response, hides when page is ready
    const preloader = document.getElementById('preloader');
    window.addEventListener('load', () => {
      if (preloader) preloader.classList.add('hidden');
    });
    window.addEventListener('beforeunload', () => {
      if (preloader) preloader.classList.remove('hidden');
    });
  </script>
</body>
</html>
