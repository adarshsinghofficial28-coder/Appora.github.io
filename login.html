<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appora — Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.0.2/dist/phosphor.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-background">
  <div class="preloader" id="preloader">
    <div class="crack crack1"></div>
    <div class="crack crack2"></div>
    <div class="crack crack3"></div>
    <div class="crack crack4"></div>
    <div class="crack crack5"></div>
  </div>

  <main class="section" style="padding: 4rem 0; min-height: calc(100vh - 120px);">
    <div class="container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
            <span class="logo-mark">A</span>
            <span class="font-extrabold text-xl">Appora</span>
          </div>
          <h1>Welcome Back</h1>
          <p class="text-sm text-muted-foreground">Sign in to access your saved apps and bookmarks.</p>
        </div>
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
        <div class="auth-footer">
          <a href="dashboard.html">Forgot password?</a>
        </div>
        <div class="auth-footer" style="margin-top: 0; border-top: 1px solid var(--color-border); padding-top: 1rem;">
          Don't have an account? <a href="login.html">Get Started</a>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script>
    const form = document.getElementById('loginForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const users = JSON.parse(localStorage.getItem('appora_users')) || [];
        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          showToast('Login successful!');
          window.location.href = 'dashboard.html';
        } else {
          showToast('Invalid email or password.');
        }
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (t) {
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
      }
    }

    // Preloader: shows on slow server response, hides when page is ready
    const preloader = document.getElementById('preloader');
    window.addEventListener('load', () => {
      if (preloader) preloader.classList.add('hidden');
    });
    window.addEventListener('beforeunload', () => {
      if (preloader) preloader.classList.remove('hidden');
    });
  </script>
</body>
</html>
